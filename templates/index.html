<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIF Print Server</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="root">
    <div id="header">
        <div id="header-title">Computer Interest Floor (CIF)</div>
    </div>





<article class="post">
    <div class="post-content">
        <center>
        <h1>CIF Print Server</h1>
        <form id="form" action="{{ request.full_path }}" method="POST" style="max-width: 80%;" enctype="multipart/form-data">
          <div class="form-group">
            <label for="file">File(s):</label>
            <input type=file name='file' multiple>
          </div>
          <div class="form-group">
            <label for="pages">Pages:</label>
            <input type="text" name="pages" id="pages" placeholder="All pages">
          </div>
          <div class="form-group">
            <label for="copies">Copies:</label>
            <input type="number" name="copies" value="1" min="1" id="copies">
          </div>
          <div class="form-group">
            <label for="color">Color:</label>
                <select name="color" id="color">
                    <option value="Black and White">Black and White</option>
                    <option value="Color">Color</option>
                </select>
          </div>
          <div class="form-group">
            <label for="perpage">Pages/sheet:</label>
                <input type="number" name="perpage" value="1" min="1" id="perpage">
          </div>
          <div class="form-group">
            <label for="orientation">Layout:</label>
                <select name="orientation" id="orientation">
                    <option value="Portrait">Portrait</option>
                    <option value="Landscape">Landscape</option>
                </select>
          </div>
          <div class="form-group">
            <label for="sided">Sides:</label>
                <select name="sided" id="sided">
                    <option value="Single Sided">Double Sided</option>
                    <option value="Double Sided">Single Sided</option>
                </select>
          </div>
          <div class="error">{{error}}</div>
          <button class="btn" id="print_button">Verify</button>
            <dialog id="popup">
                <h2 id="line1"></h2>
                <h2 id="line2"></h2>
                <button id="cancel" class="btn">Cancel</button>
                <button id="confirm" class="btn">Print</button>
            </dialog>
        </form>
	</center>
    </div>
</article>


    <div id="footer">
        <div><a href="http://print.cif.rochester.edu/points">Questions about printing points?</a></div>
        Computer Interest Floor @ University of Rochester<br>
    </div>
</div>
</body>
<script>
    function muteButton(event){
        event.preventDefault();
    }
    const popup = document.getElementById("popup");
    const print_button = document.getElementById("print_button");
    const cancel = document.getElementById("cancel");
    const form = document.getElementById("form");
    print_button.addEventListener("click", function(event){
        event.preventDefault();
        print_button.textContent = "Verifying";
        print_button.addEventListener('click', muteButton);
        fetch("/check-print?username={{username}}", {method: "POST", body: new FormData(form)}).then(response => {
            response.json().then(data => {
                const line1 = document.getElementById("line1");
                const line2 = document.getElementById("line2");
                const confirm = document.getElementById("confirm");
                if (response.status == 200){
                    line1.style.color = "#ffffff";
                    line1.textContent = "Total Points: " + data["total"];
                    line2.style.color = "#ffffff";
                    line2.textContent = "Points Spent: " + data["points"];
                    confirm.removeEventListener("click", muteButton);
                    confirm.style.visibility = "visible";
                } else {
                    line1.style.color = "#ff0000";
                    line1.textContent = data["error"];
                    line2.style.color = "#ff0000";
                    line2.textContent = Object.hasOwn(data, "error2")? data["error2"]:"";
                    confirm.addEventListener("click", muteButton);
                    confirm.style.visibility = "hidden";
                }
                popup.showModal();
                print_button.textContent = "Verify";
                print_button.removeEventListener("click", muteButton);
            }
            );
        });
    });
    cancel.addEventListener('click', function(event){
        event.preventDefault();
        popup.close();
    });
</script>
</html>
