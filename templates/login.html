<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIF Print Server</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="root">
    <div id="header">
        <div id="header-title">Computer Interest Floor (CIF)</div>
    </div>





<article class="post">
    <div class="post-content">
        <center>
        <h1>CIF Print Server</h1>

        <form action="/login" method="POST" style="max-width: 450px;">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="">
            </div>
            <div class="error">{{error}}</div>
            <button type="submit" class="btn">Authenticate</button>
        </form>
        </center>
    </div>
</article>


    <div id="footer">
        Computer Interest Floor @ University of Rochester<br>
    </div>
</div>
</body>
</html>
