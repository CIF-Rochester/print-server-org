<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>CIF Print Server</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="root">
    <div id="header">
        <div id="header-title">Computer Interest Floor (CIF)</div>
    </div>





<article class="post">

        <h1>CIF Print Server</h1>

            <button class="btn">Return to Home Page</button>
        </form>
    </div>
</article>


    <div id="footer">
        Computer Interest Floor @ University of Rochester<br>
    </div>
</div>
